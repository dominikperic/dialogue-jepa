[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dialogue-jepa"
version = "0.1.0"
description = "Research scaffold for predictive audio/text dialogue representations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Dialogue-JEPA contributors"}]
dependencies = [
  "torch>=2.2",
  "torchaudio>=2.2",
  "transformers>=4.44",
  "datasets>=3.0",
  "soundfile>=0.12",
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
  "omegaconf>=2.3",
  "tqdm>=4.66",
  "tensorboard>=2.16",
]

[project.optional-dependencies]
demo = ["gradio>=5.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/dialogue_jepa"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
